  <style>
    :root {
      --bg-void: #030712;
      --panel-bg: rgba(11, 19, 43, 0.75);
      --core-cyan: #00f0ff;
      --core-blue: #3b82f6;
      --core-violet: #8b5cf6;
      --core-glow: rgba(0, 240, 255, 0.35);
      --text-bright: #f8fafc;
      --text-dim: #94a3b8;
      --user-bubble: linear-gradient(135deg, #1d4ed8, #2563eb);
      --bot-bubble: rgba(15, 23, 42, 0.85);
      --border-hud: rgba(0, 240, 255, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-void);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
      color: var(--text-bright);
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Animated HUD Background */
    .hud-grid {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    @media (min-width: 481px) {
      .app-container {
        height: 94vh;
        border-radius: 28px;
        border: 1px solid var(--border-hud);
        box-shadow: 0 0 50px rgba(0, 240, 255, 0.15), 0 25px 60px rgba(0, 0, 0, 0.9);
      }
    }

    /* Top HUD Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-hud);
      background: rgba(3, 7, 18, 0.6);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Animated ARC-Reactor Logo */
    .reactor-core {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .core-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed var(--core-cyan);
      animation: rotateRing 8s linear infinite;
      box-shadow: 0 0 15px var(--core-glow);
    }

    .core-center {
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #ffffff, var(--core-cyan));
      border-radius: 50%;
      box-shadow: 0 0 16px var(--core-cyan);
      animation: pulseCore 2s ease-in-out infinite alternate;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseCore {
      from { transform: scale(0.85); opacity: 0.8; }
      to { transform: scale(1.15); opacity: 1; }
    }

    .brand-title h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ffffff, var(--core-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--core-cyan);
      font-weight: 600;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .memory-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--border-hud);
      color: var(--core-cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Chat Messages Stream */
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-stream::-webkit-scrollbar { width: 3px; }
    .chat-stream::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); border-radius: 4px; }

    .message-row {
      display: flex;
      width: 100%;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user-row { justify-content: flex-end; }
    .message-row.bot-row { 
      justify-content: flex-start;
      flex-direction: column;
      align-items: flex-start;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 16px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      font-weight: 500;
    }

    .user-bubble {
      background: var(--user-bubble);
      color: #ffffff;
      border-radius: 18px 18px 2px 18px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    }

    .bot-bubble {
      background: var(--bot-bubble);
      color: var(--text-bright);
      border-radius: 18px 18px 18px 2px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .source-tag {
      display: inline-block;
      font-size: 10px;
      color: var(--core-cyan);
      letter-spacing: 0.8px;
      margin-top: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* Sound Voice Button */
    .bot-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .speak-btn {
      background: rgba(0, 240, 255, 0.06);
      border: 1px solid var(--border-hud);
      color: var(--core-cyan);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .speak-btn:active {
      transform: scale(0.95);
      background: var(--core-cyan);
      color: var(--bg-void);
    }

    .speak-btn.speaking {
      border-color: #10b981;
      color: #10b981;
      animation: pulseSpeaking 1.2s infinite;
    }

    @keyframes pulseSpeaking {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Suggestion Chips */
    .suggestions-container {
      display: flex;
      gap: 8px;
      padding: 0 18px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .suggestions-container::-webkit-scrollbar { display: none; }

    .chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 500;
    }

    .chip:active {
      background: rgba(0, 240, 255, 0.15);
      color: var(--core-cyan);
      border-color: var(--core-cyan);
    }

    /* Input Dock */
    .input-dock {
      padding: 10px 16px 16px;
      background: rgba(3, 7, 18, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .input-bar {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-hud);
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 6px 6px 6px 14px;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .mic-btn.listening {
      color: #ef4444;
      animation: pulseSpeaking 1s infinite;
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-bright);
      font-size: 15px;
      font-weight: 500;
      outline: none;
    }

    input[type="text"]::placeholder { color: #64748b; }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--core-cyan), var(--core-blue));
      color: #030712;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 16px var(--core-glow);
    }

    .send-btn:active { transform: scale(0.92); }
  </style>

  <script>
    // 1. CONFIGURATION KEYS
    const GROQ_API_KEY = "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";

    const firebaseConfig = {
      apiKey: "AIzaSyDySVpj8IkJsvw0Oy75N9FC918f7TDAo9g",
      authDomain: "mozarc-72cbd.firebaseapp.com",
      projectId: "mozarc-72cbd",
      storageBucket: "mozarc-72cbd.firebasestorage.app",
      messagingSenderId: "389907773893",
      appId: "1:389907773893:web:faab0a2a6d24c12e5bb3ac",
      databaseURL: "https://mozarc-72cbd-default-rtdb.firebaseio.com"
    };

    // Firebase Initialize
    let rtdb = null;
    try {
      firebase.initializeApp(firebaseConfig);
      rtdb = firebase.database();
      console.log("Firebase RTDB Connected successfully!");
    } catch(err) {
      console.warn("Firebase Init fallback:", err);
    }

    let masterDatabase = [];
    let firebaseCache = [];
    let conversationHistory = [];

    // Welcome Greeting
    function initWelcome() {
      const welcomeText = "Greetings Mozahid! M.O.Z.A.R.C online and fully operational. Boliye, aaj kya command hai?";
      document.getElementById("welcomeBubble").innerText = welcomeText;
      
      document.getElementById("welcomeActions").innerHTML = `
        <button class="speak-btn" onclick="speakNatural('${escapeQuotes(welcomeText)}', this)">
          <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          Suniye
        </button>
      `;
    }

    // 2. Load Local Data + Sync Firebase Cloud Memory
    function initKnowledgeBase() {
      initWelcome();
      
      let combined = [];
      const datasets = [
        typeof data1 !== 'undefined' && data1,
        typeof data2 !== 'undefined' && data2,
        typeof data3 !== 'undefined' && data3,
        typeof data4 !== 'undefined' && data4,
        typeof data5 !== 'undefined' && data5,
        typeof data6 !== 'undefined' && data6,
        typeof data7 !== 'undefined' && data7,
        typeof data8 !== 'undefined' && data8,
        typeof data9 !== 'undefined' && data9,
        typeof data10 !== 'undefined' && data10,
        typeof data11 !== 'undefined' && data11,
        typeof data12 !== 'undefined' && data12,
        typeof data13 !== 'undefined' && data13,
        typeof data14 !== 'undefined' && data14,
        typeof data15 !== 'undefined' && data15,
        typeof data16 !== 'undefined' && data16,
        typeof data17 !== 'undefined' && data17,
        typeof data18 !== 'undefined' && data18,
        typeof data19 !== 'undefined' && data19,
        typeof data20 !== 'undefined' && data20
      ];

      for (let d of datasets) {
        if (d && Array.isArray(d)) combined = combined.concat(d);
      }
      masterDatabase = combined;
      updateTotalCount();

      // Listen to Realtime Database for live auto-sync
      if (rtdb) {
        rtdb.ref("knowledge").on("value", (snapshot) => {
          const val = snapshot.val();
          if (val) {
            firebaseCache = Object.values(val);
            updateTotalCount();
          }
        });
      }
    }

    function updateTotalCount() {
      const total = masterDatabase.length + firebaseCache.length;
      document.getElementById("memoryCount").innerText = `${total} SYNAPSE`;
    }

    window.addEventListener("DOMContentLoaded", initKnowledgeBase);

    // 3. User Input Handler
    const chatStream = document.getElementById("chatStream");
    const queryInput = document.getElementById("queryInput");

    queryInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") handleUserInput();
    });

    function quickQuery(text) {
      queryInput.value = text;
      handleUserInput();
    }

    async function handleUserInput() {
      const rawText = queryInput.value.trim();
      if (!rawText) return;

      appendMessage(rawText, "user");
      queryInput.value = "";

      // Tier 1: Search Local Offline Files
      let matched = searchDatabase(rawText.toLowerCase(), masterDatabase);
      let source = "LOCAL ARCHIVE";

      // Tier 2: Search Firebase Realtime Database
      if (!matched && firebaseCache.length > 0) {
        matched = searchDatabase(rawText.toLowerCase(), firebaseCache);
        source = "FIREBASE CLOUD";
      }

      // Tier 3: If not found, Ask Groq Cloud API & Auto-Learn!
      if (!matched) {
        const thinkingRow = appendThinkingIndicator();
        try {
          const groqResponse = await askGroqAI(rawText);
          removeThinkingIndicator(thinkingRow);
          
          appendMessage(groqResponse, "bot", "GROQ LIVE AI (AUTO-LEARNED)");
          speakNatural(groqResponse);

          // Auto-Save in Firebase Realtime Database
          saveToFirebase(rawText, groqResponse);
          return;
        } catch (err) {
          removeThinkingIndicator(thinkingRow);
          matched = "Network issue ya API limit reach hui hai boss, thodi der baad try kijiye.";
          source = "SYSTEM FALLBACK";
        }
      }

      // Show matched local/firebase response
      setTimeout(() => {
        appendMessage(matched, "bot", source);
        speakNatural(matched);
      }, 250);
    }

    // 4. Smart Matching Algorithm
    function searchDatabase(query, dataset) {
      // 1. Direct Keyword Match
      for (let item of dataset) {
        if (item.keywords && Array.isArray(item.keywords)) {
          for (let kw of item.keywords) {
            if (query.includes(kw.toLowerCase())) return item.answer;
          }
        }
      }

      // 2. Multi-Word Match (2-3 words overlap)
      const stopWords = ["ka", "ki", "ke", "ko", "me", "se", "hai", "hain", "kya", "tha", "the", "aur", "to", "is", "us", "ye", "wo", "batao", "karo", "bhai", "ji", "a", "an", "the"];
      const userWords = query.split(/\s+/).filter(w => w.length > 1 && !stopWords.includes(w));

      let bestMatch = null;
      let maxScore = 0;

      for (let item of dataset) {
        if (item.keywords && Array.isArray(item.keywords)) {
          for (let kw of item.keywords) {
            const kwWords = kw.toLowerCase().split(/\s+/).filter(w => w.length > 1 && !stopWords.includes(w));
            let score = 0;
            for (let w of kwWords) {
              if (userWords.includes(w)) score++;
            }
            if (score >= 2 && score > maxScore) {
              maxScore = score;
              bestMatch = item.answer;
            }
          }
        }
      }
      return bestMatch;
    }

    // 5. Groq Cloud API Call (Llama 3.1)
    async function askGroqAI(userPrompt) {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${GROQ_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "llama-3.1-8b-instant",
          messages: [
            {
              role: "system",
              content: "You are M.O.Z.A.R.C (Mujahid's Operational Zenith Artificial Responsive Core), a futuristic, sharp, witty, highly intelligent personal AI assistant to Mozahid. Speak in natural, friendly, clear conversational Hinglish. Keep answers crisp, informative (1 to 3 sentences maximum), and completely free of robotic tone. Never give long essays."
            },
            { role: "user", content: userPrompt }
          ],
          temperature: 0.7,
          max_tokens: 200
        })
      });

      const data = await response.json();
      if (data.choices && data.choices.length > 0) {
        return data.choices[0].message.content.trim();
      } else {
        throw new Error("Invalid API Response");
      }
    }

    // 6. Auto-Save to Firebase
    function saveToFirebase(questionText, answerText) {
      if (!rtdb) return;

      // Clean keywords from question
      const words = questionText.toLowerCase().split(/\s+/).filter(w => w.length > 2);

      rtdb.ref("knowledge").push({
        keywords: words,
        question: questionText,
        answer: answerText,
        timestamp: Date.now()
      }).then(() => {
        console.log("Auto-learned and saved to Firebase Realtime Database!");
      }).catch(err => console.warn("Firebase save error:", err));
    }

    // 7. Natural Speech Engine
    let currentSpeakingBtn = null;

    function speakNatural(text, btnElement = null) {
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        if (currentSpeakingBtn) {
          currentSpeakingBtn.classList.remove("speaking");
          currentSpeakingBtn.innerHTML = `Suniye`;
        }
        if (currentSpeakingBtn === btnElement) {
          currentSpeakingBtn = null;
          return;
        }
      }

      const cleanText = text.replace(/[\u{1F600}-\u{1F6FF}|[\u{2600}-\u{26FF}]/gu, '').replace(/[#*_-]/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(cleanText);

      const voices = window.speechSynthesis.getVoices();
      const voice = voices.find(v => v.lang.includes("hi") || v.lang.includes("hi-IN")) || 
                    voices.find(v => v.lang.includes("en-IN")) || 
                    voices[0];

      if (voice) utterance.voice = voice;
      utterance.lang = 'hi-IN';
      utterance.rate = 0.96;
      utterance.pitch = 1.05;

      if (btnElement) {
        currentSpeakingBtn = btnElement;
        btnElement.classList.add("speaking");
        btnElement.innerText = "Rokhein";
      }

      utterance.onend = function() {
        if (btnElement) {
          btnElement.classList.remove("speaking");
          btnElement.innerText = "Suniye";
          currentSpeakingBtn = null;
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    // 8. Speech to Text (Mic Input)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    const micBtn = document.getElementById("micBtn");

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;

      recognition.onstart = function() {
        micBtn.classList.add("listening");
        queryInput.placeholder = "Listening to your command...";
      };

      recognition.onresult = function(e) {
        queryInput.value = e.results[0][0].transcript;
        handleUserInput();
      };

      recognition.onend = function() {
        micBtn.classList.remove("listening");
        queryInput.placeholder = "Command M.O.Z.A.R.C...";
      };
    }

    function toggleVoiceInput() {
      if (!recognition) return alert("Browser voice input support nahi kar raha!");
      recognition.start();
    }

    // UI Message Append Helpers
    function appendMessage(text, sender, source = null) {
      const row = document.createElement("div");
      row.className = `message-row ${sender}-row`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${sender}-bubble`;
      bubble.innerText = text;

      if (sender === "bot" && source) {
        const tag = document.createElement("div");
        tag.className = "source-tag";
        tag.innerText = `// ${source}`;
        bubble.appendChild(tag);
      }

      row.appendChild(bubble);

      if (sender === "bot") {
        const actions = document.createElement("div");
        actions.className = "bot-actions";
        const btn = document.createElement("button");
        btn.className = "speak-btn";
        btn.innerText = "Suniye";
        btn.onclick = function() { speakNatural(text, btn); };
        actions.appendChild(btn);
        row.appendChild(actions);
      }

      chatStream.appendChild(row);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function appendThinkingIndicator() {
      const row = document.createElement("div");
      row.className = `message-row bot-row thinking-row`;
      row.innerHTML = `<div class="bubble bot-bubble" style="color: var(--core-cyan); font-family: 'Orbitron'; font-size: 13px;">M.O.Z.A.R.C PROCESSING NEURAL STREAM...</div>`;
      chatStream.appendChild(row);
      chatStream.scrollTop = chatStream.scrollHeight;
      return row;
    }

    function removeThinkingIndicator(row) {
      if (row && row.parentNode) row.parentNode.removeChild(row);
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
